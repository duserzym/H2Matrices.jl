name: Tests
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        julia: ['1']
    env:
      JULIA_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia }}
      - uses: julia-actions/cache@v2
      - name: Resolve package dependencies independently of development manifest
        run: |
          rm -f Manifest.toml
          julia --project=. -e 'using Pkg; Pkg.instantiate()'
      - uses: julia-actions/julia-runtest@v1
